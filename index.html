  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

═════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-off Fsc-raw-select>\n            <span style=\"margin-left:auto;font-size:13px;color:var(--color-neutral-600);font-variant-numeric:tabular-nums\">{{ pageLabel }}<\u002Fspan>\n            <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ prevPage }}\" disabled=\"{{ actPrevDis }}\">← Prev<\u002Fbutton>\n            <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ nextPage }}\" disabled=\"{{ actNextDis }}\">Next →<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ actEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"card blueprint\" style=\"padding:32px;text-align:center;max-width:520px;margin:30px auto\">\n              <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n              <div style=\"font-family:var(--font-heading);font-size:17px;letter-spacing:.12em;color:var(--color-neutral-700)\">NO HISTORY MATCHES<\u002Fdiv>\n              <p style=\"font-size:14px;color:var(--color-neutral-600);margin:8px 0 0\">Adjust the search or filters above.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-raw-table class=\"table\" style=\"width:100%\">\n            <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:120px\">Time<\u002Fsc-raw-th><sc-raw-th style=\"width:110px\">Type<\u002Fsc-raw-th><sc-raw-th style=\"width:110px\">Agent<\u002Fsc-raw-th><sc-raw-th>Entry<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;width:80px\">Usage<\u002Fsc-raw-th><sc-raw-th style=\"width:100px\">Status<\u002Fsc-raw-th><sc-raw-th style=\"width:80px\"><\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n            <sc-raw-tbody>\n              <sc-for list=\"{{ actRows }}\" as=\"r\" hint-placeholder-count=\"8\">\n                <sc-raw-tr style=\"animation:rowIn .3s ease both\">\n                  <sc-raw-td style=\"font-variant-numeric:tabular-nums;color:var(--color-neutral-600);white-space:nowrap\">{{ r.ts }}<\u002Fsc-raw-td>\n \"font-size:13px;color:var(--color-neutral-600)\">Preview of the section's empty / loading / error / limit-exceeded states (mock).<\u002Fspan>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ usageLoading }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"card blueprint\" style=\"padding:24px\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n              <div style=\"font-family:var(--font-heading);letter-spacing:.14em;color:var(--color-neutral-700)\">LOADING USAGE…<\u002Fdiv>\n              <div style=\"height:8px;background:var(--color-neutral-200);margin-top:14px\"><\u002Fdiv><div style=\"height:8px;background:var(--color-neutral-200);margin-top:8px;width:72%\"><\u002Fdiv><div style=\"height:8px;background:var(--color-neutral-200);margin-top:8px;width:55%\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ usageError }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"card blueprint\" style=\"padding:24px;text-align:center;max-width:520px;margin:20px auto\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n              <div style=\"font-family:var(--font-heading);font-size:17px;letter-spacing:.12em;color:var(--color-neutral-800)\">USAGE SERVICE UNREACHABLE<\u002Fdiv>\n              <p style=\"font-size:14px;color:var(--color-neutral-600);margin:8px 0 14px\">The metering endpoint did not respond. Figures shown elsewhere may be stale.<\u002Fp>\n              <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ retryUsage }}\">Retry<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ usageEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"card blueprint\" style=\"padding:24px;text-align:center;max-width:520px;margin:20px auto\"><i class=\"corner tl\"><\u002F ss=\"card blueprint\" style=\"padding:14px 16px\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"card-kicker\">Remaining<\u002Fdiv><div style=\"font-family:var(--font-heading);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums\">{{ remainFmt }}<\u002Fdiv><div class=\"card-meta\">units in period<\u002Fdiv><\u002Fdiv>\n                <div class=\"card blueprint\" style=\"padding:14px 16px\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"card-kicker\">Billing period<\u002Fdiv><div style=\"font-family:var(--font-heading);font-size:19px;font-weight:600\">{{ periodLabel }}<\u002Fdiv><div class=\"card-meta\">resets monthly<\u002Fdiv><\u002Fdiv>\n                <div class=\"card blueprint\" style=\"padding:14px 16px\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"card-kicker\">Est. limit reached<\u002Fdiv><div style=\"font-family:var(--font-heading);font-size:19px;font-weight:600\">{{ estExhaust }}<\u002Fdiv><div class=\"card-meta\">at current daily rate<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n\n              <div class=\"card blueprint\" style=\"padding:16px 18px\">\n                <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n                <div style=\"display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px\">\n                  <div class=\"card-kicker\">Usage over time (units)<\u002Fdiv>\n                  <div style=\"display:flex;border:1px solid var(--color-divider)\">\n                    <sc-for list=\"{{ periodOpts }}\" as=\"po\" hint-placeholder-count=\"3\">\n                      <button sc-camel-on-click=\"{{ po.fn }}\" style=\"border:none;pad -th>ID<\u002Fsc-raw-th><sc-raw-th>Task<\u002Fsc-raw-th><sc-raw-th>Agent<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right\">Units<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right\">% of period<\u002Fsc-raw-th><sc-raw-th><\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n                  <sc-raw-tbody>\n                    <sc-for list=\"{{ byTask }}\" as=\"r\" hint-placeholder-count=\"6\">\n                      <sc-raw-tr sc-camel-on-click=\"{{ r.open }}\" style=\"cursor:pointer\" style-hover=\"background:var(--color-accent-100)\">\n                        <sc-raw-td style=\"font-variant-numeric:tabular-nums;color:var(--color-neutral-600)\">{{ r.id }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"font-weight:500\">{{ r.title }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"font-family:var(--font-heading);letter-spacing:.06em;font-size:13.5px;color:var(--color-accent-700)\">{{ r.agentName }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"text-align:right;font-variant-numeric:tabular-nums\">{{ r.usageFmt }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"text-align:right;font-variant-numeric:tabular-nums;color:var(--color-neutral-600)\">{{ r.pct }}%<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"text-align:right\"><button class=\"btn btn-ghost\">Open<\u002Fbutton><\u002Fsc-raw-td>\n                      <\u002Fsc-raw-tr>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-tbody>\n                <\u002Fsc-raw-table>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isSettings }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;max-width:1100px\">\n          <div class=\"card blueprint\" style=\"padding:18px 20px\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <div class=\"card-kicker\">Advisory thresholds<\u002Fdiv>\n            <div class=\"field\" style=\"margin-top:12px\">\n              <label for=\"esc-th\">Escalation threshold — Safety Net hands off below <strong style=\"font-variant-numeric:tabular-nums\">{{ setEsc }}%<\u002Fstrong> confidence<\u002Flabel>\n              <input id=\"esc-th\" type=\"range\" min=\"20\" max=\"70\" step=\"5\" value=\"{{ setEsc }}\" sc-camel-on-input=\"{{ onSetEsc }}\" style=\"width:100%;accent-color:var(--color-accent)\">\n            <\u002Fdiv>\n            <div class=\"field\" style=\"margin-top:14px\">\n              <label for=\"warn-th\">Usage warning — alert at <strong style=\"font-variant-numeric:tabular-nums\">{{ setWarn }}%<\u002Fstrong> of the monthly limit<\u002Flabel>\n              <input id=\"warn-th\" type=\"range\" min=\"50\" max=\"95\" step=\"5\" value=\"{{ setWarn }}\" sc-camel-on-input=\"{{ onSetWarn }}\" style=\"width:100%;accent-color:var(--color-accent)\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"card blueprint\" style=\"padding:18px 20px\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <div class=\"card-kicker\">Notifications<\u002Fdiv>\n            <label style=\"display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--color-divider);cursor:pointer;font-size:14.5px\"><input type=\"checkbox\" checked=\"{{ notifScout }}\" sc-camel-on-change=\"{{ toggleNotifScout }}\" style=\"accent-color:var(--color-accent)\">Scout alerts — notify advisors on unprompted funding matches<\u002Flabel>\n            <label style=\"display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--color-divider);cursor:pointer;font-size:14.5px\"><input type=\"checkbox\" checked=\"{{ notifEsc }}\" sc-camel-on-change=\"{{ toggleNotifEsc }}\" style=\"accent-color:var(--color-accent)\">Escalations — email the on-duty advisor with each brief<\u002Flabel>\n            <label style=\"display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer;font-size:14.5px\"><input type=\"checkbox\" checked=\"{{ notifDigest }}\" sc-camel-on-change=\"{{ toggleNotifDigest }}\" style=\"accent-color:var(--color-accent)\">Weekly digest — usage and outcomes summary every Sunday<\u002Flabel>\n          <\u002Fdiv>\n          <div class=\"card blueprint\" style=\"padding:18px 20px\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <div class=\"card-kicker\">Workspace<\u002Fdiv>\n            <div class=\"field\" style=\"margin-top:12px\">\n              <label>Advisor interface language<\u002Flabel>\n              <div style=\"display:flex;border:1px solid var(--color-divider);width:fit-content\">\n                <sc-for list=\"{{ langOpts }}\" as=\"lo\" hint-placeholder-count=\"2\">\n                  <button sc-camel-on-click=\"{{ lo.fn }}\" style=\"border:none;padding:8px 16px;cursor:pointer;font-family:var(--font-heading);font-size:13.5px;letter-spacing:.08em;background:{{ lo.bg }};color:{{ lo.col }}\" style-hover=\"background:var(--color-accent-200)\">{{ lo.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"field\" style=\"margin-top:14px\">\n              <label for=\"retention\">Activity retention<\u002Flabel>\n              <sc-raw-select id=\"retention\" class=\"input\" value=\"{{ retention }}\" sc-camel-on-change=\"{{ onRetention }}\" style=\"width:auto\">\n                <option value=\"30\">30 days<\u002Foption><option value=\"90\">90 days<\u002Foption><option value=\"365\">1 year<\u002Foption>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n            <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ saveSettings }}\" style=\"margin-top:18px\">Save settings<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"card blueprint\" style=\"padding:18px 20px\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <div class=\"card-kicker\">Data source<\u002Fdiv>\n            <p style=\"font-size:14px;color:var(--color-neutral-800);margin:10px 0 0\">This workspace currently runs on an isolated <strong>mock data layer<\u002Fstrong> (<span style=\"font-variant-numeric:tabular-nums\">workspace-data.js<\u002Fspan>). Nothing shown is live. Replacing <em>fetchWorkspace()<\u002Fem> with FastAPI endpoints — same return shape — connects real data without UI changes.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fmain>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ toastOn }}\" hint-placeholder-val=\"{{ false }}\">\n    <div role=\"status\" style=\"position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:80;background:var(--color-neutral-900);color:var(--color-neutral-100);padding:10px 18px;font-size:14px;box-shadow:var(--shadow-md);animation:rowIn .25s ease both\">{{ toastMsg }}<\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ taskOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"dialog-backdrop\" sc-camel-on-click=\"{{ closeTask }}\" style=\"position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb, var(--color-neutral-900) 45%, transparent)\">\n      <div class=\"dialog blueprint\" role=\"dialog\" aria-modal=\"true\" sc-camel-on-click=\"{{ stopClick }}\" style=\"width:760px;max-width:94vw;max-height:88vh;overflow:auto;background:var(--color-bg);padding:24px 28px;box-shadow:var(--shadow-lg);border:1px solid var(--color-divider)\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:14px\">\n          <div>\n            <div style=\"font-size:13px;color:var(--color-neutral-600);font-variant-numeric:tabular-nums\">{{ dId }} · {{ dCatName }}<\u002Fdiv>\n            <h4 style=\"margin:2px 0 0;letter-spacing:.04em\">{{ dTitle }}<\u002Fh4>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px\">\n            <span style=\"display:inline-block;font-family:var(--font-heading);font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border:1px solid {{ dTagBorder }};background:{{ dTagBg }};color:{{ dTagCol }}\">{{ dStatus }}<\u002Fspan>\n            <button class=\"btn btn-icon btn-ghost\" sc-camel-on-click=\"{{ closeTask }}\" aria-label=\"Close task detail\">✕<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px;border-top:1px solid var(--color-divider);padding-top:14px\">\n          <div><div style=\"font-family:var(--font-heading);font-size:11.5px;letter-spacing:.14em;color:var(--color-neutral-600)\">AGENT<\u002Fdiv><div style=\"font-size:14px;color:var(--color-accent-700);font-family:var(--font-heading);letter-spacing:.06em\">{{ dAgent }}<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-family:var(--font-heading);font-size:11.5px;letter-spacing:.14em;color:var(--color-neutral-600)\">BENEFICIARY<\u002Fdiv><div style=\"font-size:14px\">{{ dBen }}<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-family:var(--font-heading);font-size:11.5px;letter-spacing:.14em;color:var(--color-neutral-600)\">STARTED<\u002Fdiv><div style=\"font-size:14px;font-variant-numeric:tabular-nums\">{{ dStarted }}<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-family:var(--font-heading);font-size:11.5px;letter-spacing:.14em;color:var(--color-neutral-600)\">COMPLETED<\u002Fdiv><div style=\"font-size:14px;font-variant-numeric:tabular-nums\">{{ dCompleted }}<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-family:var(--font-heading);font-size:11.5px;letter-spacing:.14em;color:var(--color-neutral-600)\">DURATION<\u002Fdiv><div style=\"font-size:14px\">{{ dDuration }}<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-family:var(--font-heading);font-size:11.5px;letter-spacing:.14em;color:var(--color-neutral-600)\">USAGE<\u002Fdiv><div style=\"font-size:14px;font-variant-numeric:tabular-nums\">{{ dUsageFmt }} units<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-family:var(--font-heading);font-size:11.5px;letter-spacing:.14em;color:var(--color-neutral-600)\">RETRIES<\u002Fdiv><div style=\"font-size:14px;font-variant-numeric:tabular-nums\">{{ dRetries }}<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-family:var(--font-heading);font-size:11.5px;letter-spacing:.14em;color:var(--color-neutral-600)\">PROGRESS<\u002Fdiv><div style=\"height:6px;background:var(--color-neutral-200);margin-top:7px;position:relative\"><span style=\"position:absolute;left:0;top:0;bottom:0;width:{{ dProgressW }};background:var(--color-accent)\"><\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ dErrOn }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:14px;border:1px solid var(--color-neutral-400);background:var(--color-neutral-200);padding:10px 14px;font-size:14px;color:var(--color-neutral-900)\"><strong>Error:<\u002Fstrong> {{ dErr }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"margin-top:14px\">\n          <div style=\"font-family:var(--font-heading);font-size:11.5px;letter-spacing:.14em;color:var(--color-neutral-600)\">OUTPUT / RESULT<\u002Fdiv>\n          <p style=\"font-size:14.5px;margin:5px 0 0;color:var(--color-neutral-800)\">{{ dOutput }}<\u002Fp>\n        <\u002Fdiv>\n        <sc-if value=\"{{ dHasFiles }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:14px\">\n            <div style=\"font-family:var(--font-heading);font-size:11.5px;letter-spacing:.14em;color:var(--color-neutral-600)\">FILES &amp; RESOURCES<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:6px\">\n              <sc-for list=\"{{ dFiles }}\" as=\"f\" hint-placeholder-count=\"1\"><span class=\"tag tag-outline\" style=\"font-variant-numeric:tabular-nums\">▤ {{ f }}<\u002Fspan><\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"margin-top:16px;border-top:1px solid var(--color-divider);padding-top:12px\">\n          <div style=\"font-family:var(--font-heading);font-size:11.5px;letter-spacing:.14em;color:var(--color-neutral-600)\">ACTIVITY TIMELINE<\u002Fdiv>\n          <sc-if value=\"{{ dHasLogs }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;flex-direction:column;margin-top:6px\">\n              <sc-for list=\"{{ dLogs }}\" as=\"lg\" hint-placeholder-count=\"3\">\n                <div style=\"display:grid;grid-template-columns:110px 90px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--color-divider);font-size:13.5px\">\n                  <span style=\"color:var(--color-neutral-600);font-variant-numeric:tabular-nums\">{{ lg.ts }}<\u002Fspan>\n                  <span class=\"tag tag-outline\" style=\"justify-self:start\">{{ lg.typeLabel }}<\u002Fspan>\n                  <span>{{ lg.summary }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ dNoLogs }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"font-size:13.5px;color:var(--color-neutral-600);margin:6px 0 0\">No activity recorded yet — the task has not started.<\u002Fp><\u002Fsc-if>\n        <\u002Fdiv>\n        <sc-if value=\"{{ confirmOn }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:16px;border:1px solid var(--color-accent-400);background:var(--color-accent-100);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap\">\n            <span style=\"font-size:14px;color:var(--color-accent-900)\">{{ confirmMsg }}<\u002Fspan>\n            <span style=\"margin-left:auto;display:flex;gap:8px\"><button class=\"btn btn-primary\" sc-camel-on-click=\"{{ confirmYes }}\">Confirm<\u002Fbutton><button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ confirmNo }}\">Keep task<\u002Fbutton><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div class=\"dialog-actions\" style=\"display:flex;gap:8px;margin-top:18px;flex-wrap:wrap\">\n          <sc-for list=\"{{ dActions }}\" as=\"da\" hint-placeholder-count=\"2\">\n            <button class=\"{{ da.cls }}\" sc-camel-on-click=\"{{ da.fn }}\">{{ da.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;defaultView&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;overview&quot;,&quot;options&quot;:[&quot;overview&quot;,&quot;agents&quot;,&quot;tasks&quot;,&quot;categories&quot;,&quot;activity&quot;,&quot;usage&quot;,&quot;settings&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Workspace&quot;},&quot;warnThreshold&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:75,&quot;min&quot;:50,&quot;max&quot;:95,&quot;step&quot;:5,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Workspace&quot;},&quot;collapsedNav&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Workspace&quot;}}\">\nconst CAT_NAMES = { intake: 'Intake & Transcription', profiling: 'Beneficiary Profiling', pathways: 'Pathway Planning', scouting: 'Funding Scouting', escalation: 'Confidence & Escalation' };\nconst AGENT_NAMES = { listener: 'LISTENER', planner: 'PLANNER', scout: 'SCOUT', safety: 'SAFETY NET' };\nconst TYPE_LABELS = { request: 'Request', action: 'Action', tool: 'Tool', output: 'Output', file: 'File', error: 'Error', escalation: 'Escalation' };\nconst VIEW_META = {\n  overview: ['Overview', 'نظرة عامة'], agents: ['Agents', 'الوكلاء'], tasks: ['Tasks', 'المهام'],\n  categories: ['Categories', 'الفئات'], activity: ['Activity / History', 'السجل'],\n  usage: ['Usage & Limits', 'الاستخدام والحدود'], settings: ['Settings', 'الإعدادات']\n};\nconst TAG_STYLES = {\n  active: { bg: 'var(--color-accent-500)', col: '#fff', border: 'var(--color-accent-500)' },\n  completed: { bg: 'var(--color-accent-100)', col: 'var(--color-accent-800)', border: 'var(--color-accent-300)' },\n  queued: { bg: 'transparent', col: 'var(--color-neutral-700)', border: 'var(--color-neutral-400)' },\n  paused: { bg: 'var(--color-neutral-200)', col: 'var(--color-neutral-800)', border: 'var(--color-neutral-300)' },\n  failed: { bg: 'var(--color-neutral-900)', col: 'var(--color-neutral-100)', border: 'var(--color-neutral-900)' },\n  cancelled: { bg: 'transparent', col: 'var(--color-neutral-500)', border: 'var(--color-neutral-300)' }\n};\nconst STATUS_ORDER = { active: 0, paused: 1, queued: 2, failed: 3, completed: 4, cancelled: 5 };\n\nclass Component extends DCLogic {\n  state = {\n    db: null, tasks: [], view: 'overview', collapsed: false, toast: '',\n    taskSearch: '', taskStatus: 'all', taskCat: 'all', taskSort: 'recent', groupOn: false,\n    selId: null, confirm: null,\n    actSearch: '', actAgent: 'all', actType: 'all', actPage: 0,\n    usagePeriod: 'daily', usageState: 'normal', usageCat: 'all',\n    setEsc: 40, setWarn: 75, notifScout: true, notifEsc: true, notifDigest: false, lang: 'en', retention: '90',\n    nextId: 1052\n  };\n\n  componentDidMount() {\n    this.setState({\n      view: this.props.defaultView ?? 'overview',\n      collapsed: !!(this.props.collapsedNav ?? false),\n      setWarn: this.props.warnThreshold ?? 75\n    });\n    const grab = () => {\n      const m = window.MurshidData;\n      if (!m) { this.dataT = setTimeout(grab, 60); return; }\n      m.fetchWorkspace().then((db) => this.setState({ db, tasks: db.tasks.slice() }));\n    };\n    grab();\n    this.onResize = () => { if (window.innerWidth < 980 && !this.state.collapsed) this.setState({ collapsed: true }); };\n    window.addEventListener('resize', this.onResize);\n    this.onResize();\n  }\n  componentWillUnmount() { window.removeEventListener('resize', this.onResize); clearTimeout(this.toastT); clearTimeout(this.dataT); }\n\n  fmt(n) { return (n || 0).toLocaleString('en-US'); }\n  toast(msg) { clearTimeout(this.toastT); this.setState({ toast: msg }); this.toastT = setTimeout(() => this.setState({ toast: '' }), 2600); }\n  goView(v) { this.setState({ view: v, actPage: 0 }); }\n  mutTask(id, patch) { this.setState({ tasks: this.state.tasks.map((t) => t.id === id ? Object.assign({}, t, patch) : t) }); }\n\n  taskActions(t) {\n    const acts = [];\n    const btn = (label, fn, primary) => ({ label, fn, cls: primary ? 'btn btn-primary' : 'btn btn-secondary' });\n    if (t.status === 'active') { acts.push(btn('Pause', () => { this.mutTask(t.id, { status: 'paused' }); this.toast(t.id + ' paused'); }, true)); acts.push(btn('Cancel…', () => this.setState({ confirm: { msg: 'Cancel ' + t.id + '? Its progress is discarded.', act: () => { this.mutTask(t.id, { status: 'cancelled' }); this.toast(t.id + ' cancelled'); } } }))); }\n    if (t.status === 'paused') { acts.push(btn('Continue', () => { this.mutTask(t.id, { status: 'active' }); this.toast(t.id + ' resumed'); }, true)); acts.push(btn('Cancel…', () => this.setState({ confirm: { msg: 'Cancel ' + t.id + '? Its progress is discarded.', act: () => { this.mutTask(t.id, { status: 'cancelled' }); this.toast(t.id + ' cancelled'); } } }))); }\n    if (t.status === 'queued') { acts.push(btn('Start now', () => { this.mutTask(t.id, { status: 'active', progress: 5, started: 'Jul 16 · 10:02' }); this.toast(t.id + ' started'); }, true)); acts.push(btn('Cancel…', () => this.setState({ confirm: { msg: 'Remove ' + t.id + ' from the queue?', act: () => { this.mutTask(t.id, { status: 'cancelled' }); this.toast(t.id + ' cancelled'); } } }))); }\n    if (t.status === 'failed') { acts.push(btn('Retry', () => { this.mutTask(t.id, { status: 'queued', retries: t.retries + 1, error: null }); this.toast(t.id + ' re-queued (retry ' + (t.retries + 1) + ')'); }, true)); }\n    if (t.status === 'completed' || t.status === 'failed' || t.status === 'cancelled') {\n      acts.push(btn('Duplicate', () => {\n        const id = 'T-' + this.state.nextId;\n        const copy = Object.assign({}, t, { id, status: 'queued', progress: 0, usage: 0, started: '—', completed: '—', duration: '—', error: null, retries: 0, output: '—', files: [] });\n        this.setState({ tasks: [copy].concat(this.state.tasks), nextId: this.state.nextId + 1, selId: id }); this.toast(t.id + ' duplicated as ' + id);\n      }));\n      acts.push(btn('Archive…', () => this.setState({ confirm: { msg: 'Archive ' + t.id + '? It is removed from the task list (history is kept).', act: () => { this.setState({ tasks: this.state.tasks.filter(x => x.id !== t.id), selId: null }); this.toast(t.id + ' archived'); } } })));\n    }\n    return acts;\n  }\n\n  renderVals() {\n    const s = this.state, db = s.db;\n    const nav = {}; const gv = {};\n    Object.keys(VIEW_META).forEach((v) => {\n      const on = s.view === v;\n      nav[v] = { bg: on ? 'var(--color-accent-100)' : 'transparent', col: on ? 'var(--color-accent-800)' : 'var(--color-neutral-700)' };\n      gv[v] = () => this.goView(v);\n    });\n    const base = {\n      nav, gv, sideW: s.collapsed ? '58px' : '232px', navDisp: s.collapsed ? 'none' : 'block',\n      collapseGlyph: s.collapsed ? '»' : '«', toggleNav: () => this.setState({ collapsed: !s.collapsed }),\n      viewTitle: VIEW_META[s.view][0], viewAr: VIEW_META[s.view][1],\n      goUsage: () => this.goView('usage'),\n      toastOn: !!s.toast, toastMsg: s.toast,\n      dbLoading: !db,\n      isOverview: false, isAgents: false, isTasks: false, isCategories: false, isActivity: false, isUsage: false, isSettings: false,\n      taskOpen: false, usedPct: 0, usedBarW: '0%', usedFmt: '', limitFmt: '', remainFmt: '',\n      newIntake: () => {\n        if (!db) return;\n        const id = 'T-' + s.nextId;\n        this.setState({ tasks: [{ id, title: 'New intake — awaiting voice note', cat: 'intake', agent: 'listener', beneficiary: 'Unassigned', status: 'queued', progress: 0, started: '—', completed: '—', duration: '—', usage: 0, output: '—', error: null, retries: 0, files: [] }].concat(s.tasks), nextId: s.nextId + 1, view: 'tasks' });\n        this.toast('Intake task ' + id + ' queued for Listener');\n      }\n    };\n    if (!db) return base;\n\n    const u = db.usage;\n    const usedPct = Math.round(u.used / u.limit * 100);\n    Object.assign(base, {\n      usedPct, usedBarW: usedPct + '%', usedFmt: this.fmt(u.used), limitFmt: this.fmt(u.limit),\n      remainFmt: this.fmt(u.limit - u.used), periodLabel: u.periodStart + ' — ' + u.periodEnd,\n      periodEnd: u.periodEnd, estExhaust: u.estExhaust, estShort: 'Jul 28',\n      warnOn: usedPct >= s.setWarn\n    });\n    base['is' + s.view.charAt(0).toUpperCase() + s.view.slice(1)] = true;\n\n    const openTask = (id) => () => this.setState({ selId: id, confirm: null });\n    const counts = { active: 0, queued: 0, paused: 0, failed: 0, completed: 0, cancelled: 0 };\n    s.tasks.forEach((t) => { counts[t.status] = (counts[t.status] || 0) + 1; });\n    base.nActive = counts.active; base.nQueued = counts.queued; base.nPaused = counts.paused;\n    base.nFailed = counts.failed + counts.cancelled; base.nCompleted = counts.completed;\n    base.nAgentsActive = db.agents.filter((a) => a.status === 'active').length;\n\n    // Overview\n    const maxD = Math.max(...u.trendDaily.map((d) => d.v));\n    base.trendBars = u.trendDaily.map((d) => ({ h: Math.round(d.v / maxD * 100) + '%', tip: d.label + ' — ' + this.fmt(d.v) + ' units' }));\n    const catTot = db.categories.reduce((a, c) => a + c.used, 0);\n    base.topCats = db.categories.slice().sort((a, b) => b.used - a.used).map((c) => ({\n      name: c.name, usedFmt: this.fmt(c.used), barW: Math.round(c.used / catTot * 100) + '%',\n      go: () => this.setState({ view: 'tasks', taskCat: c.id, taskStatus: 'all' })\n    }));\n    base.recentAct = db.activity.slice(0, 6).map((a) => ({\n      ts: a.ts.replace('Jul 16 · ', ''), agent: AGENT_NAMES[a.agent], summary: a.summary,\n      open: a.taskId ? openTask(a.taskId) : () => this.goView('activity')\n    }));\n    base.runScan = () => {\n      const id = 'T-' + s.nextId;\n      this.setState({ tasks: [{ id, title: 'On-demand funding scan — 14 sources', cat: 'scouting', agent: 'scout', beneficiary: 'All beneficiaries', status: 'active', progress: 3, started: 'Jul 16 · 10:02', completed: '—', duration: 'just started', usage: 4, output: 'Scan starting…', error: null, retries: 0, files: [] }].concat(s.tasks), nextId: s.nextId + 1, view: 'tasks' });\n      this.toast('Scout started funding scan ' + id);\n    };\n\n    // Agents\n    base.agentCards = db.agents.map((a) => ({\n      name: a.name, ar: a.ar, role: a.role, desc: a.desc,\n      statusLabel: a.status === 'active' ? 'WORKING' : 'IDLE',\n      stCol: a.status === 'active' ? 'var(--color-accent-700)' : 'var(--color-neutral-500)',\n      stAnim: a.status === 'active' ? 'pulseDot 1.6s ease-in-out infinite' : 'none',\n      tasksDone: a.tasksDone, usageFmt: this.fmt(a.usage), errorRate: a.errorRate, last: a.last, caps: a.caps,\n      recent: s.tasks.filter((t) => t.agent === a.id).slice(0, 3).map((t) => ({ id: t.id, title: t.title, statusLabel: t.status.toUpperCase(), open: openTask(t.id) }))\n    }));\n\n    // Tasks\n    const q = s.taskSearch.toLowerCase();\n    let rows = s.tasks.filter((t) =>\n      (s.taskStatus === 'all' || t.status === s.taskStatus) &&\n      (s.taskCat === 'all' || t.cat === s.taskCat) &&\n      (!q || (t.title + ' ' + t.beneficiary + ' ' + t.id).toLowerCase().includes(q)));\n    if (s.taskSort === 'usage') rows = rows.slice().sort((a, b) => b.usage - a.usage);\n    else if (s.taskSort === 'name') rows = rows.slice().sort((a, b) => a.title.localeCompare(b.title));\n    else if (s.taskSort === 'status') rows = rows.slice().sort((a, b) => STATUS_ORDER[a.status] - STATUS_ORDER[b.status]);\n    const toRow = (t) => {\n      const tg = TAG_STYLES[t.status];\n      return { id: t.id, title: t.title, catName: CAT_NAMES[t.cat], agentName: AGENT_NAMES[t.agent], beneficiary: t.beneficiary, status: t.status, tagBg: tg.bg, tagCol: tg.col, tagBorder: tg.border, progressW: t.progress + '%', usageFmt: this.fmt(t.usage), when: t.started === '—' ? 'queued' : t.started, open: openTask(t.id) };\n    };\n    if (s.groupOn) {\n      base.taskGroups = Object.keys(CAT_NAMES).map((cid) => {\n        const g = rows.filter((t) => t.cat === cid);\n        return g.length ? { showName: true, name: CAT_NAMES[cid], count: g.length + (g.length === 1 ? ' task' : ' tasks'), rows: g.map(toRow) } : null;\n      }).filter(Boolean);\n    } else {\n      base.taskGroups = rows.length ? [{ showName: false, name: '', count: '', rows: rows.map(toRow) }] : [];\n    }\n    base.tasksEmpty = rows.length === 0;\n    base.taskSearch = s.taskSearch;\n    base.onTaskSearch = (e) => this.setState({ taskSearch: e.target.value });\n    base.statusOpts = ['all', 'active', 'queued', 'paused', 'completed', 'failed'].map((st) => ({\n      label: st === 'all' ? 'ALL' : st.toUpperCase(), fn: () => this.setState({ taskStatus: st }),\n      bg: s.taskStatus === st ? 'var(--color-accent-100)' : 'transparent',\n      col: s.taskStatus === st ? 'var(--color-accent-800)' : 'var(--color-neutral-700)'\n    }));\n    base.taskCat = s.taskCat; base.onTaskCat = (e) => this.setState({ taskCat: e.target.value });\n
